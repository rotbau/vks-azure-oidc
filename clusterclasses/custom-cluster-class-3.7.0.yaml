apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: custom-cc-service-account
  namespace: test-ns
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: tkc-control-plane-v3.7.0
    machineInfrastructure:
      templateRef:
        apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
        kind: VSphereMachineTemplate
        name: tkc-control-plane-v3.7.0
  infrastructure:
    templateRef:
      apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
      kind: VSphereClusterTemplate
      name: tkc-infrastructure-v3.7.0
  workers:
    machineDeployments:
      - class: node-pool
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: tkc-md-v3.7.0
        infrastructure:
          templateRef:
            apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            name: tkc-md-v3.7.0
  patches:
    - name: default
      external:
        generatePatchesExtension: generate-patches.runtime-extension
        discoverVariablesExtension: discover-variables.runtime-extension
        settings:
          version: v3.7.0
    - name: kubeadm-native-issuer-patch
      description: >-
        Uses kubeadm native patches directory (durable across re-renders) to
        always append the kubeadm default --service-account-issuer as a
        second, accepted-only entry.
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /run/kubeadm/patches/kube-apiserver0+json.json
                owner: "root:root"
                permissions: "0644"
                content: >-
                  [{"op":"add","path":"/spec/containers/0/command/-","value":"--service-account-issuer=https://kubernetes.default.svc.cluster.local"}]