apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: custom-cc-service-account-v34
  namespace: test-ns                            # Set to vSphere Namespace where VKS cluster will be created
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: tkc-control-plane-v3.4.0
    machineInfrastructure:
      templateRef:
        apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
        kind: VSphereMachineTemplate
        name: tkc-control-plane-v3.4.0
  infrastructure:
    templateRef:
      apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
      kind: VSphereClusterTemplate
      name: tkc-infrastructure-v3.4.0
  workers:
    machineDeployments:
      - class: node-pool
        bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: tkc-md-v3.4.0
        infrastructure:
          templateRef:
            apiVersion: vmware.infrastructure.cluster.x-k8s.io/v1beta2
            kind: VSphereMachineTemplate
            name: tkc-md-v3.4.0
  patches:
    - name: default
      external:
        generatePatchesExtension: generate-patches.runtime-extension
        discoverVariablesExtension: discover-variables.runtime-extension
        settings:
          version: v3.4.0

    - name: kubeadm-native-issuer-patch
      description: >-
        Uses kubeadm native patches directory (durable across re-renders) to
        always append the kubeadm default --service-account-issuer as a
        second, accepted-only entry. Also wires initConfiguration/joinConfiguration
        .patches.directory since this CC version does not set it by default
        (unlike v3.7+).
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/files/-
              value:
                path: /run/kubeadm/patches/kube-apiserver0+json.json
                owner: "root:root"
                permissions: "0644"
                content: >-
                  [{"op":"add","path":"/spec/containers/0/command/-","value":"--service-account-issuer=https://kubernetes.default.svc.cluster.local"}]
            # CC v3.4.0 doesn't set this by default (v3.7+ does) - added as a new
            # key on the existing initConfiguration object, not a replace
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/initConfiguration/patches
              value:
                directory: /run/kubeadm/patches
            # same as above, but for control-plane replacement/join nodes
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/joinConfiguration/patches
              value:
                directory: /run/kubeadm/patches

    - name: raw-external-service-account-issuer
      description: >-
        Sets the external issuer as the primary/signing service-account-issuer
        via a raw ClusterClass patch, with no dependency on the oidc variable
        (not available on ClusterClass versions before v3.7.0).
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/-
              value:
                name: service-account-issuer
                value: https://test-issuer-c.example.com/test-ns/test-sa-issuer